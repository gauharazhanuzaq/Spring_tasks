app:
  greeting:
    message: "Hello from DEV, Gauhar!"
    max-length: 100
    enabled: true
  aspect:
    slow-threshold-ms: 200
server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_tasks
    username: ${DB_USER:spring}
    password: ${DB_PASSWORD:spring}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: true
logging:
  level:
    com.example.practice5.aspect: info