springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
spring:
  application:
    name: practice1
  profiles:
    active: dev
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: artworks
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
app:
  rates:
    base-url: https://open.er-api.com/v6
    connect-timeout: 1s
    read-timeout: 2s