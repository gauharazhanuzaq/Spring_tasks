spring:
  application:
    name: practice1
  profiles:
    active: dev
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: artworks
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
